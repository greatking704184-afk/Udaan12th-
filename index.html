<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>Udaan 12 – Coaching App</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b2b;--bg2:#1a1650;--ink:#f4f1ff;--mute:#a9a4d6;--sun:#ffb02e;--pink:#ff4f8b;--cyan:#3fe0ff;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0d0b2b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg));color:var(--ink);font-family:Hind,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.logo{font-family:'Baloo 2',system-ui,sans-serif}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.45;z-index:0;animation:float 14s ease-in-out infinite}
.o1{width:260px;height:260px;background:var(--pink);top:-60px;left:-80px}
.o2{width:300px;height:300px;background:var(--cyan);bottom:-100px;right:-100px;animation-delay:-5s;opacity:.3}
.o3{width:180px;height:180px;background:var(--sun);top:45%;left:60%;animation-delay:-9s;opacity:.25}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 18px 100px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.logo{font-size:28px;font-weight:800;letter-spacing:.5px}
.logo b{display:inline-block;background:linear-gradient(90deg,var(--sun),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo i{font-style:normal;display:inline-block;animation:fly 2.6s ease-in-out infinite}
@keyframes fly{50%{transform:translate(4px,-6px) rotate(8deg)}}
.tag{font-size:13px;color:var(--mute)}
.hello{font-size:34px;font-weight:800;line-height:1.1;margin:8px 0 4px}
.hello span{display:inline-block;opacity:0;transform:translateY(30px) rotate(6deg);animation:pop .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.sub{color:var(--mute);margin-bottom:22px}

/* ID card */
.scene{perspective:1000px;margin:10px 0 8px}
.idc{position:relative;border-radius:26px;padding:20px;background:linear-gradient(135deg,#2b2380,#5b2a9c 55%,#c0307a);border:1px solid rgba(255,255,255,.25);box-shadow:0 30px 60px -20px rgba(255,79,139,.5),0 0 0 1px rgba(255,255,255,.05) inset;transform-style:preserve-3d;transition:transform .15s ease-out;overflow:hidden;animation:enter 1.1s cubic-bezier(.2,1,.3,1) .5s both}
@keyframes enter{from{opacity:0;transform:rotateX(70deg) translateY(80px) scale(.8)}}
.idc::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 62%);transform:translateX(var(--sx,-100%));transition:transform .3s;pointer-events:none;mix-blend-mode:overlay}
.idc.auto::before{animation:shine 4s ease-in-out 1.8s infinite}
@keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.idtop{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-bottom:14px;transform:translateZ(20px)}
.idrow{display:flex;gap:16px;align-items:center;transform:translateZ(40px)}
.ph{width:104px;height:124px;border-radius:18px;background:rgba(255,255,255,.15) center/cover;border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;font-size:40px;cursor:pointer;flex:none;position:relative}
.ph small{position:absolute;bottom:-9px;background:var(--sun);color:#2a1a00;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px}
.idinfo h2{font-size:24px;line-height:1.1}
.idinfo p{font-size:13px;opacity:.9;margin-top:3px}
.idno{margin-top:10px;display:inline-block;font-family:'Baloo 2';font-weight:700;letter-spacing:2px;background:rgba(0,0,0,.3);padding:4px 12px;border-radius:10px;font-size:15px}
.bars{display:flex;gap:2px;margin-top:16px;height:22px;transform:translateZ(20px);opacity:.75}
.bars i{background:#fff;flex:1;border-radius:1px}
.edit{margin:14px 0 26px;display:flex;gap:10px;flex-wrap:wrap}
button,.btn{font:600 15px Hind,sans-serif;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);transition:transform .15s,background .2s}
button:active,.btn:active{transform:scale(.94)}
button:focus-visible,.ph:focus-visible,.g:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.pri{background:linear-gradient(90deg,var(--sun),var(--pink));color:#2a0f1c;border:0;font-weight:700}
.form{display:none;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:20px;background:var(--card);padding:14px;border-radius:18px;border:1px solid var(--line)}
.form.open{display:grid;animation:drop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.form label{font-size:12px;color:var(--mute);display:grid;gap:4px}
.form input,.form select{font:500 15px Hind;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.form .full{grid-column:1/-1}
select option{color:#000}

.stu{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.sc{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:6px 14px 6px 6px;border-radius:99px;font-size:14px;flex:none}
.sc u{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2) center/cover;display:grid;place-items:center;font-size:14px;text-decoration:none}
.sc.on{background:var(--cyan);color:#06222b;border-color:var(--cyan)}
.sc.add{background:linear-gradient(90deg,var(--sun),var(--pink));color:#2a0f1c;border:0;padding:6px 16px}
@keyframes flip{from{opacity:0;transform:rotateY(90deg) scale(.9)}}
/* gallery */
.sec{display:flex;justify-content:space-between;align-items:end;margin:6px 0 12px}
.sec h3{font-size:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;font-size:14px}
.chip.on{background:var(--sun);color:#2a1a00;border-color:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.g{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#000 center/cover;border:1px solid var(--line);cursor:pointer;animation:gin .6s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes gin{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
.g:hover{transform:translateY(-4px) rotate(-1deg);transition:.2s}
.g span{position:absolute;inset:auto 0 0;padding:26px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:13px;font-weight:500}
.g em{position:absolute;top:8px;left:8px;font-style:normal;font-size:11px;background:var(--pink);padding:2px 9px;border-radius:99px;font-weight:600}
.empty{grid-column:1/-1;text-align:center;padding:40px 20px;border:2px dashed var(--line);border-radius:20px;color:var(--mute)}
.empty b{display:block;font-size:46px;animation:fly 2.4s infinite}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5;width:64px;height:64px;border-radius:50%;font-size:32px;padding:0;background:linear-gradient(135deg,var(--sun),var(--pink));color:#2a0f1c;border:0;box-shadow:0 10px 30px rgba(255,79,139,.55);animation:pulse 2.4s infinite;display:grid;place-items:center}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,176,46,.6),0 10px 30px rgba(255,79,139,.55)}70%,100%{box-shadow:0 0 0 22px rgba(255,176,46,0),0 10px 30px rgba(255,79,139,.55)}}
.cfab{position:fixed;left:max(18px,calc(50% - 262px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5;height:56px;padding:0 20px 0 16px;border-radius:99px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--cyan),#6a7bff);color:#06222b;font-weight:700;border:0;box-shadow:0 10px 28px rgba(63,224,255,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.cfab b{background:var(--pink);color:#fff;min-width:22px;height:22px;border-radius:99px;font-size:12px;display:none;place-items:center;padding:0 6px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.cfab b.on{display:grid;opacity:1;transform:none}
.cw{position:fixed;inset:0;z-index:15;display:none;background:rgba(5,4,20,.55);backdrop-filter:blur(4px)}
.cw.open{display:block;animation:fade .25s}
.cp{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;height:82vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#221d66,#120f3a);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:sheet .55s cubic-bezier(.2,1.2,.3,1)}
@keyframes sheet{from{transform:translateY(100%)}}
.ch{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.ch h3{font-size:20px;flex:1;line-height:1.1}.ch small{color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#46e58a;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(70,229,138,.7)}100%{box-shadow:0 0 0 9px rgba(70,229,138,0)}}
.cm{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{display:flex;gap:8px;max-width:86%;animation:mi .45s cubic-bezier(.2,1.4,.4,1) both;transform-origin:bottom left}
.m.me{align-self:flex-end;flex-direction:row-reverse;transform-origin:bottom right}
@keyframes mi{from{opacity:0;transform:translateY(18px) scale(.7)}}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 14px 'Baloo 2';color:#111}
.bub{background:rgba(255,255,255,.1);padding:8px 13px;border-radius:18px 18px 18px 4px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.me .bub{background:linear-gradient(135deg,var(--sun),var(--pink));color:#2a0f1c;border-radius:18px 18px 4px 18px;font-weight:500}
.bub i{display:block;font-style:normal;font-size:11px;opacity:.7;margin-bottom:2px;font-weight:600}
.bub s{display:block;text-decoration:none;font-size:10px;opacity:.55;text-align:right;margin-top:2px}
.cn{text-align:center;color:var(--mute);padding:30px 18px;font-size:14px}
.cn b{display:block;font-size:44px;animation:fly 2.4s infinite}
.typ{display:none;gap:4px;align-self:flex-start;padding:10px 14px;background:rgba(255,255,255,.1);border-radius:18px}
.typ.on{display:flex}.typ i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:tp 1s infinite}
.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-6px);opacity:.4}}
.emo{display:flex;gap:6px;padding:6px 14px;overflow-x:auto;scrollbar-width:none}
.emo button{padding:4px 10px;font-size:20px;border-radius:12px;flex:none}
.cf{display:flex;gap:8px;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.cf input{flex:1;font:500 16px Hind;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:99px;padding:12px 16px;min-width:0}
.cf input:focus{outline:2px solid var(--cyan)}
.send{width:48px;height:48px;border-radius:50%;padding:0;font-size:20px;background:linear-gradient(135deg,var(--sun),var(--pink));border:0;color:#2a0f1c}
.send.go{animation:zip .5s ease-out}
@keyframes zip{40%{transform:translate(8px,-10px) rotate(25deg) scale(1.2)}}
.bub img{display:block;width:min(220px,58vw);border-radius:14px;margin:2px 0 4px;cursor:zoom-in;animation:zoom .5s cubic-bezier(.2,1.3,.4,1)}
.vp{display:flex;align-items:center;gap:10px;min-width:190px}
.vp button{width:38px;height:38px;border-radius:50%;padding:0;font-size:15px;flex:none;background:rgba(0,0,0,.28);color:inherit;border:0}
.wv{display:flex;align-items:center;gap:2px;height:30px;flex:1}
.wv i{width:3px;border-radius:3px;background:currentColor;opacity:.35;transition:opacity .15s,transform .15s}
.wv i.f{opacity:1}.vp.pl .wv i.f{animation:wb .7s ease-in-out infinite}
@keyframes wb{50%{transform:scaleY(1.5)}}
.vp small{font-size:11px;opacity:.8;min-width:30px;text-align:right}
.rec{display:none;align-items:center;gap:10px;flex:1;background:rgba(255,60,90,.18);border:1px solid rgba(255,90,110,.6);border-radius:99px;padding:0 8px 0 16px;height:48px;animation:drop .3s}
.cf.rc .rec{display:flex}.cf.rc input,.cf.rc #cam,.cf.rc #mic{display:none}
.rd{width:12px;height:12px;border-radius:50%;background:#ff3b5c;animation:rp 1s infinite}
@keyframes rp{50%{transform:scale(1.5);opacity:.5}}
.rec b{flex:1;font-family:'Baloo 2';font-size:17px}
.rec button{padding:6px 12px;border-radius:99px}
.ib{width:44px;height:48px;border-radius:50%;padding:0;font-size:20px;flex:none}
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,#2b2380,#0d0b2b 72%);animation:spBg 4.3s ease-in forwards;pointer-events:none}
@keyframes spBg{0%,60%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
.sbox{display:flex;flex-direction:column;align-items:center;gap:18px}
.slogo{position:relative;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:66px;background:linear-gradient(135deg,var(--sun),var(--pink));box-shadow:0 0 0 0 rgba(255,176,46,.6),0 20px 50px rgba(255,79,139,.5);animation:lg 4.3s cubic-bezier(.3,1.1,.4,1) forwards}
.slogo::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.4);animation:ring 1.8s ease-out .6s 1 both}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes lg{0%{transform:scale(0) rotate(-40deg)}20%{transform:scale(1.15) rotate(6deg)}28%{transform:scale(1) rotate(0)}62%{transform:translateY(0) scale(1);opacity:1}92%{transform:translateY(-42vh) scale(.28);opacity:1}100%{transform:translateY(-42vh) scale(.28);opacity:0}}
.stx{animation:tx 4.3s ease forwards}
.stx h2{font:800 30px/1.15 'Baloo 2',sans-serif;background:linear-gradient(90deg,var(--sun),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.stx p{margin-top:6px;font:600 22px 'Baloo 2',sans-serif;color:var(--ink)}
@keyframes tx{0%,14%{opacity:0;transform:translateY(24px) scale(.9)}28%{opacity:1;transform:none}56%{opacity:1;transform:none}70%,100%{opacity:0;transform:translateY(-14px)}}
@keyframes crown{50%{transform:translateY(-8px) rotate(-12deg)}}
body:not(.go) main *{animation-play-state:paused}
.admin{margin:34px auto 0;width:max-content;max-width:100%;padding:3px;border-radius:99px;background:linear-gradient(90deg,var(--sun),var(--pink),var(--cyan),var(--sun));background-size:300% 100%;animation:flow 4s linear infinite;box-shadow:0 8px 30px rgba(255,79,139,.35)}
@keyframes flow{to{background-position:300% 0}}
.admin div{display:flex;align-items:center;gap:10px;padding:10px 22px;border-radius:99px;background:#150f45;font:700 17px 'Baloo 2'}
.admin em{font-style:normal;display:inline-block;animation:crown 2s ease-in-out infinite}
.admin b{background:linear-gradient(90deg,var(--sun),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:19px}
.admin small{color:var(--mute);font:500 13px Hind}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spinA{to{--a:360deg}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.spot{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(280px circle at var(--mx,50%) var(--my,28%),rgba(130,150,255,.22),transparent 70%)}
.hello{font-size:40px;line-height:1.08;perspective:700px;filter:drop-shadow(0 0 16px rgba(255,79,139,.5))}
.hello span{display:inline-block;opacity:0;transform:translateY(46px) rotateX(-90deg) scale(.6);filter:blur(10px);background:linear-gradient(90deg,var(--sun),var(--pink),var(--cyan),var(--sun));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:letter .9s cubic-bezier(.2,1.4,.4,1) forwards,flow 4s linear infinite}
@keyframes letter{to{opacity:1;transform:none;filter:blur(0)}}
.sub{min-height:26px}
.cur{display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.logo b{background:linear-gradient(90deg,var(--sun),var(--pink),var(--cyan),var(--sun));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite;filter:drop-shadow(0 0 10px rgba(255,79,139,.5))}
.sec h3{background:linear-gradient(90deg,var(--ink),var(--sun),var(--pink),var(--ink));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
.scene{position:relative}
.scene::before{content:"";position:absolute;inset:-4px;border-radius:30px;background:conic-gradient(from var(--a),#ffb02e,#ff4f8b,#3fe0ff,#ffb02e);filter:blur(16px);opacity:.65;animation:spinA 5s linear infinite}
.stx h2{filter:drop-shadow(0 0 16px rgba(255,79,139,.55))}
.g:hover{box-shadow:0 0 24px rgba(63,224,255,.45)}
button{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.45);animation:rp2 .6s ease-out forwards;pointer-events:none}
@keyframes rp2{to{transform:scale(4);opacity:0}}
html{overflow-x:hidden}
.chip{flex:none;min-height:40px}
.h1a{font-size:26px;letter-spacing:.5px}
.h1b{font-size:38px;line-height:1.05;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;backdrop-filter:blur(6px);animation:gin .6s cubic-bezier(.2,1.3,.4,1) both}
.stats div:nth-child(2){animation-delay:.1s}.stats div:nth-child(3){animation-delay:.2s}
.stats b{display:block;font:800 26px 'Baloo 2';background:linear-gradient(90deg,var(--sun),var(--pink),var(--cyan),var(--sun));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite}
.stats small{color:var(--mute);font-size:12px}
.lb{position:fixed;inset:0;z-index:20;background:rgba(5,4,20,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.lb.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.lb img{max-width:100%;max-height:68vh;border-radius:18px;animation:zoom .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes zoom{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.lb p{font-weight:600}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:#fff;color:#111;padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.splash{display:none}*{animation:none!important;transition:none!important}.hello span{opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div class="spot"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="splash" aria-hidden="true"><div class="sbox"><div class="slogo">🎓</div><div class="stx"><h2>12वीं के सभी विद्यार्थियों</h2><p>आप सबका स्वागत है 🙏</p></div></div></div>
<script>setTimeout(function(){document.body.classList.add('go')},2900)</script>
<main>
  <header><div class="logo">Udaan<b>12</b> <i>🎓</i></div><div class="tag">Class 12 Coaching</div></header>
  <h1 class="hello" id="hello"></h1>
  <p class="sub"><span id="tw"></span><span class="cur"></span></p>
  <div class="stu" id="stu"></div>

  <div class="scene"><div class="idc auto" id="idc">

<script>

// 3D tilt
const idc=$('idc');
function tilt(x,y){const r=idc.getBoundingClientRect();const px=(x-r.left)/r.width-.5,py=(y-r.top)/r.height-.5;
  idc.classList.remove('auto');idc.style.animation='none';
  idc.style.transform=`rotateY(${px*22}deg) rotateX(${-py*22}deg)`;idc.style.setProperty('--sx',(px*200)+'%')}
function untilt(){idc.style.transform='';idc.style.setProperty('--sx','-100%')}
idc.addEventListener('pointermove',e=>tilt(e.clientX,e.clientY));
idc.addEventListener('pointerleave',untilt);idc.addEventListener('pointerup',untilt);

// shrink image
function shrink(file,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}

  x.fillStyle=g;x.beginPath();x.roundRect(0,0,900,520,40);x.fill();
  x.fillStyle='#fff';x.font='700 26px sans-serif';x.fillText('UDAAN 12 • COACHING',44,64);

    x.font='500 30px sans-serif';x.fillText('Class 12th • '+S.stream,330,245);x.fillText('Batch: '+S.batch,330,290);

  if(S.photo){const im=new Image();im.onload=()=>{x.save();x.beginPath();x.roundRect(44,110,240,300,30);x.clip();x.drawImage(im,44,110,240,300);x.restore();done()};im.src=S.photo}else done();
};

$('lbd').onclick=()=>{S.imgs=S.imgs.filter(i=>i!==cur);persist();$('lb').classList.remove('open');renderG();toast('Photo hata di')};

function flip(){idc.style.animation='none';void idc.offsetWidth;idc.style.animation='flip .6s cubic-bezier(.2,1.2,.4,1) both'}
function renderStu(){stats();
  $('stu').innerHTML=S.students.map((t,i)=>`<button class="sc chip ${i===S.sel?'on':''}" data-i="${i}"><u style="background-image:${t.photo?`url(${t.photo})`:'none'}">${t.photo?'':'👤'}</u>${t.name.split(' ')[0]}</button>`).join('')+'<button class="sc add" id="addStu">＋ Naya student</button>';
}
$('stu').onclick=e=>{
  if(e.target.closest('#addStu')){S.students.push({name:'Naya Student',id:'UD12-'+String(S.students.length+1).padStart(4,'0'),stream:'Science',batch:'Morning',photo:''});S.sel=S.students.length-1;persist();renderId();flip();$('form').classList.remove('open');$('editBtn').click();toast('Naya ID card ban gaya – naam bharo');return}
  const b=e.target.closest('.sc');if(b){S.sel=+b.dataset.i;persist();renderId();flip();$('form').classList.remove('open')}
};
$('delStu').onclick=()=>{if(S.students.length<2){toast('Kam se kam ek student rakho');return}S.students.splice(S.sel,1);S.sel=0;persist();renderId();flip();toast('Student hata diya')};
renderId();renderG();
// ---- Chat (Firebase) ----
// Firebase console se mili config yahan paste karo:
const FIREBASE_CONFIG={
  apiKey:'YAHAN_API_KEY',
  authDomain:'YAHAN.firebaseapp.com',
  projectId:'YAHAN_PROJECT_ID',
  storageBucket:'YAHAN.appspot.com',
  messagingSenderId:'YAHAN',
  appId:'YAHAN_APP_ID'
};
let db=null,uid='',open0=false,seen=0,first=true,chatOn=false;
const CM=$('cm');
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 85% 70%)`};
function msgEl(m,n){
  const me=m.uid===uid;const d=document.createElement('div');d.className='m'+(me?' me':'');
  if(!first)d.style.animationDelay='0s';else d.style.animationDelay=Math.min(n*30,600)+'ms';
  const a=document.createElement('div');a.className='av';a.style.background=col(m.name||'?');a.textContent=(m.name||'?').trim().charAt(0).toUpperCase();
  const b=document.createElement('div');b.className='bub';
  if(!me){const i=document.createElement('i');i.textContent=m.name||'Student';b.appendChild(i)}
  if(m.img){const im=document.createElement('img');im.src=m.img;im.alt='Photo';im.onclick=()=>{cur=null;$('lbi').src=m.img;$('lbt').textContent=(m.name||'')+' ki photo';$('lbd').style.display='none';$('lb').classList.add('open')};b.appendChild(im)}
  if(m.aud)b.appendChild(voice(m));
  if(m.t)b.appendChild(document.createTextNode(m.t));
  const s=document.createElement('s');s.textContent=new Date(m.ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});b.appendChild(s);
  d.append(a,b);return d;
}
function drawChat(docs){
  CM.innerHTML='';
  if(!docs.length){CM.innerHTML='<div class="cn"><b>👋</b>Abhi koi message nahi.<br>Pehla message aap bhejo!</div>'}
  docs.forEach((m,i)=>CM.appendChild(msgEl(m,i)));
  const t=document.createElement('div');t.className='typ';t.id='typ';t.innerHTML='<i></i><i></i><i></i>';CM.appendChild(t);
  CM.scrollTop=CM.scrollHeight;first=false;
}
function badge(n){const u=$('unread');u.textContent=n>9?'9+':n;u.classList.toggle('on',n>0)}
async function initChat(){
  try{
    if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.startsWith('YAHAN')){$('cst').textContent='Firebase config daalna baaki hai';return}
    firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
    try{uid=localStorage.getItem('udaan_uid');if(!uid){uid='u'+Math.random().toString(36).slice(2,11);localStorage.setItem('udaan_uid',uid)}}catch(e){uid='u'+Math.random().toString(36).slice(2,11)}
    chatOn=true;$('cst').textContent='online';
    db.collection('chat').orderBy('ts','desc').limit(40).onSnapshot(sn=>{
      const docs=sn.docs.map(d=>d.data()).reverse();
      if(!open0&&!first){const add=Math.max(0,docs.length-seen);const mine=docs.slice(-add).filter(m=>m.uid!==uid).length;if(mine){window._un=(window._un||0)+mine;badge(window._un)}}
      seen=docs.length;drawChat(docs);
    },()=>{$('cst').textContent='chat load nahi hua'});
  }catch(e){$('cst').textContent='internet ya Firebase check karo'}
}
$('emo').innerHTML=['👍','😂','🔥','🙏','📚','💯','🎉','😅'].map(e=>`<button type="button">${e}</button>`).join('');
$('emo').onclick=e=>{if(e.target.tagName==='BUTTON'){$('ci').value+=e.target.textContent;$('ci').focus()}};
$('cfab').onclick=()=>{open0=true;window._un=0;badge(0);$('cw').classList.add('open');setTimeout(()=>{CM.scrollTop=CM.scrollHeight},60)};
const closeC=()=>{open0=false;$('cw').classList.remove('open')};
$('cx').onclick=closeC;$('cw').onclick=e=>{if(e.target.id==='cw')closeC()};
$('cf').onsubmit=async e=>{
  e.preventDefault();
  if($('cf').classList.contains('rc')){if(mr&&mr.state==='recording')mr.stop();return}
  const t=$('ci').value.trim();if(!t)return;
  $('ci').value='';
  if(!(await post({t})))$('ci').value=t;
};

function fmt(n){n=Math.round(n||0);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
let curAud=null;
function voice(m){
  const w=document.createElement('div');w.className='vp';
  const bt=document.createElement('button');bt.type='button';bt.textContent='▶';bt.setAttribute('aria-label','Voice chalao');
  const wv=document.createElement('div');wv.className='wv';
  const N=24,seed=(m.ts||1)%97;
  for(let i=0;i<N;i++){const e=document.createElement('i');e.style.height=(8+((i*seed*7+i*13)%22))+'px';wv.appendChild(e)}
  const tm=document.createElement('small');tm.textContent=fmt(m.dur);
  w.append(bt,wv,tm);
  const bars=[...wv.children];let a=null;
  bt.onclick=()=>{
    if(a&&!a.paused){a.pause();return}
    if(curAud&&curAud!==a)curAud.pause();
    if(!a){a=new Audio(m.aud);
      a.ontimeupdate=()=>{const k=a.duration?a.currentTime/a.duration:0;bars.forEach((x,i)=>x.classList.toggle('f',i<=k*N));tm.textContent=fmt(a.currentTime)};
      a.onplay=()=>{w.classList.add('pl');bt.textContent='⏸'};
      a.onpause=()=>{w.classList.remove('pl');bt.textContent='▶'};
      a.onended=()=>{bars.forEach(x=>x.classList.remove('f'));tm.textContent=fmt(m.dur);bt.textContent='▶'};}
    curAud=a;a.play().catch(()=>toast('Voice chal nahi payi'));
  };
  return w;
}
async function post(x){if(!db){toast('Chat abhi connect nahi hai');return false}
  const sb=$('sb');sb.classList.remove('go');void sb.offsetWidth;sb.classList.add('go');
  try{await db.collection('chat').doc().set(Object.assign({t:'',name:cs().name,uid,ts:Date.now()},x));return true}catch(e){toast('Message nahi gaya – dobara try karo');return false}}
// photo
$('cam').onclick=()=>$('cimg').click();
$('cimg').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;toast('Photo bhej raha hoon…');
  let max=720,q=.6,d;
  for(let k=0;k<4;k++){d=await shrinkQ(f,max,q);if(d.length<95000)break;max*=.8;q-=.08}
  if(d.length>180000){toast('Photo bahut badi hai');return}
  post({img:d});
};
function shrinkQ(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
// voice
let mr=null,chunks=[],t0=0,tick=null,cancelled=false,stream=null;
function stopRec(){clearInterval(tick);$('cf').classList.remove('rc');if(stream)stream.getTracks().forEach(t=>t.stop())}
$('mic').onclick=async()=>{
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Is browser mein recording nahi chalti');return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Mic ki permission nahi mili');return}
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  mr=new MediaRecorder(stream,Object.assign({audioBitsPerSecond:16000},mt?{mimeType:mt}:{}));
  chunks=[];cancelled=false;
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{
    const dur=(Date.now()-t0)/1000;stopRec();if(cancelled||dur<.8)return;
    const rd=new FileReader();rd.onload=()=>{if(rd.result.length>200000){toast('Recording bahut badi hai');return}post({aud:rd.result,dur})};
    rd.readAsDataURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'}));
  };
  t0=Date.now();mr.start();$('cf').classList.add('rc');$('rt').textContent='0:00';
  tick=setInterval(()=>{const s=(Date.now()-t0)/1000;$('rt').textContent=fmt(s);if(s>=30&&mr.state==='recording')mr.stop()},250);
};
$('rcx').onclick=()=>{cancelled=true;if(mr&&mr.state==='recording')mr.stop()};


// ---- Light & motion ----
function countTo(el,n){const from=+el.dataset.v||0;el.dataset.v=n;const t0=performance.now();
  (function s(t){const k=Math.min(1,(t-t0)/700);el.textContent=Math.round(from+(n-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)}
function stats(){countTo($('sS'),S.students.length);countTo($('sP'),S.imgs.length)}
setTimeout(()=>document.body.classList.add('go'),3600);

(function(){
  const P=['अपना ID card बनाओ ✨','lecture की photo देखो 📚','दोस्तों के साथ chat करो 💬'];
  const G=w=>window.Intl&&Intl.Segmenter?[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(w)].map(x=>x.segment):Array.from(w);
  const A=P.map(G),el=$('tw');let p=0,i=0,del=false;
  function t(){const w=A[p];el.textContent=w.slice(0,i).join('');
    if(!del&&i<w.length){i++;setTimeout(t,75)}else if(!del){del=true;setTimeout(t,1500)}
    else if(i>0){i--;setTimeout(t,35)}else{del=false;p=(p+1)%A.length;setTimeout(t,300)}}
  t();
})();
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');d.className='rip';
  d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),650)});
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('fx'),x=c.getContext('2d'),root=document.documentElement;let W,H,D=Math.min(devicePixelRatio||1,2),ps=[],m={x:-999,y:-999};
  function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
    const n=Math.round(Math.min(38,W*H/20000));
    ps=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.8+.7,h:Math.random()*360}))}
  rs();addEventListener('resize',rs);
  addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY;root.style.setProperty('--mx',e.clientX+'px');root.style.setProperty('--my',e.clientY+'px')},{passive:true});
  function f(){x.clearRect(0,0,W,H);const T=performance.now()/40;
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);if(d>0&&d<120){p.x+=dx/d*1.6;p.y+=dy/d*1.6}
      x.beginPath();x.fillStyle=`hsla(${(p.h+T)%360},90%,70%,.85)`;x.shadowBlur=12;x.shadowColor=x.fillStyle;x.arc(p.x,p.y,p.r,0,7);x.fill()}
    x.shadowBlur=0;
    for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<110){x.strokeStyle=`rgba(160,170,255,${.22*(1-d/110)})`;x.lineWidth=.7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
    requestAnimationFrame(f)}
  f();
})();
initChat();
</script>
